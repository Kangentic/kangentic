# Deploy web demo
#
# Builds the static web build of the renderer (`npm run build:demo`, into
# dist/demo/) and publishes it to GitHub Pages at
# https://kangentic.github.io/kangentic/. The release graph (release.yml's
# deploy-demo job) calls this after the release is published, so the web demo
# always shows the shipped app and never a ref ahead of or behind it.
# workflow_dispatch is for a manual redeploy of a tag or branch.
#
# The same site serves the README's board image (readme/board-dark.png and
# readme/board-light.png), taken from a release's poster set. See the step
# "Add the README board stills" for which release, and why every deploy
# carries them.
#
# The build base is /kangentic/ because a project Pages site serves under the
# repository name. demo/vite.config.mts defaults to /demo/ for local runs, which
# would 404 every asset on Pages, so the base is passed on the CLI here.
name: Deploy web demo

on:
  workflow_call:
    inputs:
      ref:
        description: The tag or branch to build the demo from
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: The tag or branch to build the demo from
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Not cancel-in-progress: a deployment that is
# half-way through is left to finish and the next one queues behind it, so a
# manual redeploy racing a release deploy cannot leave the site torn.
concurrency:
  group: pages
  cancel-in-progress: false

# A called workflow does not inherit release.yml's env, so it sets its own: no CUDA download
# from nuget.org in npm ci. The note at the top of ci.yml has the details.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # A release tag whose checkout carries a different package.json version is
      # a wrong ref (a tag that moved, or a hand-typed dispatch input off by
      # one), and a demo that claims one version while running another is worse
      # than no demo at all. So the version gate fails rather than warns, and
      # both branches print which way they went.
      #
      # release.yml hands over github.ref on a tag push, which is the FULL ref
      # (refs/tags/vX.Y.Z), so the refs/tags/ prefix is stripped before the
      # release-tag test. Without that strip the gate would never fire on the
      # release path, the one it exists for, and would skip in silence.
      #
      # The ref reaches the script through env rather than spliced into the
      # script text, because a dispatch input is free text and a quote in it
      # would otherwise rewrite the script instead of failing the comparison.
      - name: State the ref and version
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          version=$(node -p "require('./package.json').version")
          echo "Building the web demo from ref '$REF'; package.json version is $version."
          if printf '%s' "$tag" | grep -qE '^v[0-9]'; then
            if [ "$version" != "${tag#v}" ]; then
              echo "::error::Ref $REF is a release tag, but its package.json version is $version rather than ${tag#v}. Refusing to deploy a demo that does not match the shipped app. Check that the tag points at the release commit, or dispatch with the ref that carries $version."
              exit 1
            fi
            echo "Ref $REF is a release tag and its version matches package.json; deploying version $version."
          else
            echo "Ref $REF is not a release tag (no v<digit> prefix), so no version match is required; deploying version $version from it."
          fi

      # --with-deps, unlike ci.yml's UI job: that job caches the browser and
      # relies on the runner image already shipping Chromium's libraries to save
      # about two minutes per shard. This runs once per release, so the apt
      # install is a cheap guarantee that the smoke below can launch at all.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the web demo
        run: npm run build:demo -- --base=/kangentic/

      # The smoke runs against dist/demo as built above, so it exercises the
      # exact bytes at the exact base path that ship, not a separate dev build.
      # --fail-on-flaky-tests: a test that passes only on its CI retry fails the
      # smoke, as in ci.yml (see the note above ci.yml's UI shards run step).
      - name: Smoke-test the built demo
        run: npm run test:demo -- --fail-on-flaky-tests

      # Every README (README.md, i18n/README.*.md, packages/launcher/README.md) loads its hero
      # from this site, at readme/board-dark.png and readme/board-light.png. A Pages deploy replaces
      # the whole site, so every deploy carries both, a manual one included, or the next redeploy
      # breaks the README. They are the board scene's rust and clay posters out of a release's
      # demo-posters-<version>.zip, copied as shot (3200 by 2000, about 400 KB each).
      #
      # Which release: the ref's own when it is a release tag and its zip is attached. When that zip
      # is missing (the shoot failed, so demo-posters has already turned the release run red), the
      # newest OLDER release that has one, so the README keeps the previous image instead of
      # breaking. A ref that is not a release tag takes the newest release with a zip. Never
      # /releases/latest: a release is latest before its posters are shot. Nothing found fails the
      # deploy rather than publishing a site the README cannot load from. The ref reaches the script
      # through env, and the jq takes it with --arg, as in the version step above.
      - name: Add the README board stills
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          self=""
          if printf '%s' "$tag" | grep -qE '^v[0-9]'; then
            if ! printf '%s' "$tag" | grep -qE '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
              echo "::error::Ref $REF is a release tag but not a plain vX.Y.Z version, so no poster set can be matched to it. Dispatch with a vX.Y.Z tag or a branch."
              exit 1
            fi
            self="$tag"
          fi
          gh api "repos/$REPOSITORY/releases?per_page=100" > /tmp/releases.json
          source_tag=$(jq -r --arg self "$self" \
            'def ver: ltrimstr("v") | split(".") | map(tonumber); [.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | select(if $self == "" then true else (.tag_name | ver) <= ($self | ver) end) | select(.tag_name as $release | any(.assets[]?; .name == "demo-posters-\($release | ltrimstr("v")).zip"))] | max_by(.tag_name | ver) | .tag_name // empty' \
            /tmp/releases.json)
          if [ -z "$source_tag" ]; then
            echo "::error::No published release${self:+ at or below $self} carries a demo-posters-<version>.zip, so there are no README board stills to deploy. The API returned $(jq 'length' /tmp/releases.json) release(s). Re-run release.yml's demo-posters job for a release, then redeploy."
            exit 1
          fi
          if [ -z "$self" ]; then
            echo "Ref $REF is not a release tag; taking the README board stills from the newest release with a poster set, $source_tag."
          elif [ "$source_tag" = "$self" ]; then
            echo "Taking the README board stills from $self's own poster set."
          else
            echo "::warning::$self has no demo-posters zip attached, so the README keeps the board stills from $source_tag. Re-run demo-posters for $self, then redeploy."
          fi
          version="${source_tag#v}"
          zip="$RUNNER_TEMP/readme-stills/demo-posters-$version.zip"
          gh release download "$source_tag" --repo "$REPOSITORY" --pattern "demo-posters-$version.zip" --dir "$RUNNER_TEMP/readme-stills" --clobber
          mkdir -p dist/demo/readme
          unzip -p "$zip" board.rust.frame.png > dist/demo/readme/board-dark.png
          unzip -p "$zip" board.clay.frame.png > dist/demo/readme/board-light.png
          for still in board-dark.png board-light.png; do
            file="dist/demo/readme/$still"
            signature=$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')
            if [ "$signature" != "89504e470d0a1a0a" ]; then
              echo "::error::readme/$still taken from $source_tag's poster set is not a PNG (first bytes $signature). Refusing to deploy a README image that will not load."
              exit 1
            fi
            echo "readme/$still: $(stat -c %s "$file") bytes from $source_tag."
          done

      # configure-pages is the first step to notice that Pages is not enabled
      # for the repository, and it fails the run there. See the deploy job
      # below for why that is the wanted outcome.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

  # deploy-pages (and configure-pages above) FAILS when GitHub Pages is not
  # enabled for the repository (Settings -> Pages -> Build and deployment ->
  # Source: GitHub Actions). That is the wanted, loud behaviour: the default
  # GITHUB_TOKEN cannot enable Pages itself, so a run that could not publish
  # has to say so rather than exit green with nothing deployed.
  #
  # The github-pages environment that Pages creates limits deployments to the
  # default branch by default. release.yml calls this workflow from a tag ref,
  # so that environment needs a `v*` tag rule under Settings -> Environments ->
  # github-pages, or deploy-pages fails here naming the protection rule. Also
  # loud, also correct.
  deploy:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: State the deployed URL
        run: echo "Deployed the web demo to ${{ steps.deployment.outputs.page_url }}"
