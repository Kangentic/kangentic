name: Sign-ins and distribution

# What only this catches: something outside this repo that broke with no code
# change. Every other tier fakes these services, so all of them stay green and a
# user finds out first.
#
# Two jobs, one script each. Both hold no secret and install nothing, and every
# probe is a request a stranger could make.
#
#   - sign-ins (scripts/check-integrations.mjs). Sign in with Trello, Atlassian,
#     Linear and GitLab each depend on a registration and a page outside this
#     repo. Someone deletes or regenerates the Trello key, drops
#     https://kangentic.com from its allowed origins, revokes the Atlassian,
#     Linear or GitLab app, or the kangentic.com pages stop serving. The script
#     reads the ids this checkout ships and asks each service about them. A
#     sign-in whose id is still empty reports as pending and does not fail the
#     run, so the summary is also the list of owner steps left.
#     docs/integrations/boards.md, "Daily sign-in check", has each probe.
#   - distribution (scripts/check-distribution.mjs). The release GitHub calls
#     latest still carries every file and feed an update needs, npm's launcher
#     installs it, the landing page shows its star count, and the domain and its
#     certificates are not near their end dates.
#     docs/releases/scheduled-checks.md, "Daily distribution check", has each probe.
#
# Runs daily, on demand, and on a pull request that changes a file a check
# reads, so the PR that commits a new key or client id has it checked before it
# merges. A failed scheduled run emails the person who last changed the cron line
# below, and /release reads the last scheduled run before a tag
# (.claude/skills/release/SKILL.md, Pre-flight step 8).
#
# Costs two ubuntu-24.04 jobs of about 20 seconds each. The distribution job
# takes about 80 seconds more on a night the star count is missing, because it
# reads the page again before it calls that a failure. Deliberately NOT a
# required check. It asks outside services, so one of them being down must not
# block an unrelated merge.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-integrations.mjs'
      - 'scripts/check-distribution.mjs'
      - 'scripts/lib/check-report.mjs'
      - 'src/main/boards/adapters/trello/constants.ts'
      - 'src/main/boards/adapters/jira/constants.ts'
      - 'src/main/boards/adapters/linear/constants.ts'
      - 'src/main/boards/adapters/gitlab/constants.ts'
      - 'src/main/boards/shared/loopback-sign-in.ts'
      - 'src/shared/docs-links.ts'
      - 'src/shared/relay.ts'
      - 'electron-builder.yml'
      - 'packages/launcher/package.json'
      - '.github/workflows/integrations.yml'
  schedule:
    # 04:43 UTC. Off the hour so it does not land in the cron rush.
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-ins:
    name: Shipped sign-ins (Trello, Jira, Linear, GitLab)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # No npm ci, because the script uses only Node's own modules. It exits non-zero when any check fails.
      - name: Check the shipped sign-ins
        run: node scripts/check-integrations.mjs

  distribution:
    name: Published release, npm, site and domain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # No npm ci here either. It exits non-zero when any check fails.
      - name: Check the published release, the launcher, the site and the domain
        run: node scripts/check-distribution.mjs
