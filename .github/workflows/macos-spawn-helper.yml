name: macOS spawn-helper

# Compiles Kangentic's build of node-pty's macOS spawn-helper
# (build/spawn-helper/spawn-helper.c) on real macOS and proves it, both unsigned
# and ad-hoc signed with hardened runtime (the kernel flag the release's
# Developer ID signature sets): a child exec'd through it has no inherited mach
# exception port, the cwd and exec contract holds, a real node-pty session
# runs through it with a controlling tty, and a child_process shell launch
# shaped like src/main/pty/spawn/shell-launch.ts's (stdin a pipe) starts with no
# port while a control launch sees one. See build/install-spawn-helper.js.
#
# Without this job the C code would first compile on the macOS leg of the
# release matrix. The same gates run there too (build/afterPack.js on the
# unsigned app, build/afterSign.js on the signed one), but a failure at that
# point costs a release.
#
# The job also runs a spawn's typed launch through real zsh: macOS keeps 1024
# bytes of a line a shell is not yet reading, and only a Mac's tty has that
# limit (tests/unit/typed-launch-round-trip.test.ts). It shares this job so a
# real node-pty session on macOS costs no second macOS slot (test-value.md).
# The same step runs a failed launch through real zsh and the real spawn flow
# (tests/unit/launch-failure-real-shell.test.ts): only a real POSIX shell shows a
# zsh dying in its startup file, or a signal death, reaching the report.
#
# Path-filtered, and deliberately NOT a required check: ci.yml runs at the job
# cap (see the note at the top of that file), and this only has something to say when the helper, its gates, node-pty, or the typed launch change.
# package-lock.json is in the filter because a node-pty bump is the change most
# likely to break the helper's contract.

on:
  pull_request:
    branches: [main]
    paths:
      - 'build/spawn-helper/**'
      - 'build/install-spawn-helper.js'
      - 'build/afterPack.js'
      - 'build/afterSign.js'
      - 'package-lock.json'
      - 'src/main/pty/spawn/typed-launch.ts'
      - 'src/main/pty/agent-launch-report.ts'
      - 'src/main/pty/lifecycle/session-spawn-flow.ts'
      - 'tests/unit/typed-launch-round-trip.test.ts'
      - 'tests/unit/launch-failure-real-shell.test.ts'
      - '.github/workflows/macos-spawn-helper.yml'
  push:
    branches: [main]
    paths:
      - 'build/spawn-helper/**'
      - 'build/install-spawn-helper.js'
      - 'build/afterPack.js'
      - 'build/afterSign.js'
      - 'package-lock.json'
      - 'src/main/pty/spawn/typed-launch.ts'
      - 'src/main/pty/agent-launch-report.ts'
      - 'src/main/pty/lifecycle/session-spawn-flow.ts'
      - 'tests/unit/typed-launch-round-trip.test.ts'
      - 'tests/unit/launch-failure-real-shell.test.ts'
      - '.github/workflows/macos-spawn-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-spawn-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the run below on a push whose tree its PR already tested. See the note at the top of ci.yml.
  tested-tree:
    name: Tree already tested
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check the pushed tree against its PR
        id: tree
        uses: ./.github/actions/tested-tree

  self-test:
    name: macOS spawn-helper self-test
    needs: [tested-tree]
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # --ignore-scripts: the self-test needs node-pty's shipped prebuilds only,
      # not the Electron binary that the root postinstall downloads.
      - name: Install dependencies (npm ci)
        run: npm ci --ignore-scripts
      - name: Compile and verify the spawn-helper
        run: node build/install-spawn-helper.js --self-test
      # --ignore-scripts skipped node-pty's own step that marks its shipped helper
      # executable, and a real PTY spawns through it.
      - name: Make node-pty's spawn-helper executable
        run: chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper
      # A launch failed under this theme's instant prompt, which draws a prompt
      # before the startup files finish. Pinned: v1.20.0, a commit a tag cannot move.
      - name: Check out powerlevel10k
        run: |
          git init "$RUNNER_TEMP/powerlevel10k"
          git -C "$RUNNER_TEMP/powerlevel10k" fetch --depth 1 https://github.com/romkatv/powerlevel10k.git 35833ea15f14b71dbcebc7e54c104d8d56ca5268
          git -C "$RUNNER_TEMP/powerlevel10k" checkout FETCH_HEAD
          echo "KANGENTIC_POWERLEVEL10K_DIRECTORY=$RUNNER_TEMP/powerlevel10k" >> "$GITHUB_ENV"
      # Verbose and not silent, so the job log carries the hangup line.
      - name: Run a typed launch and a failed launch through real zsh
        # A missing zsh fails the run instead of skipping it.
        env:
          KANGENTIC_TYPED_LAUNCH_REQUIRE_SHELLS: zsh
        run: npx vitest run tests/unit/typed-launch-round-trip.test.ts tests/unit/launch-failure-real-shell.test.ts --silent=false --reporter=verbose
