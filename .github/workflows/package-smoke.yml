name: Package smoke

# Packages the app on Windows x64, macOS (Apple silicon and Intel) and Linux
# (x64 and arm64) exactly as `npm run package` does locally (electron-builder
# --dir: no installer, nothing published), then
# runs scripts/package-smoke.mjs against the result. The script launches the
# packaged app isolated, runs a terminal (the pty host), reads the Knowledge
# Graph snapshot (the retrieval worker), deletes a task whose terminal left a
# detached process and requires the task reap to stop it (koffi in the
# packaged pty host on Windows and macOS), quits the way a user does, and fails
# on any log line saying a forked process crashed or fell back.
#
# Every other tier starts the app from the repo, so before this workflow a
# packaged build first ran on macOS and Linux on the release matrix, after the
# tag existed. The afterPack gates (build/afterPack.js) run here too, on every
# target: they load each forked process's native modules from the unpacked tree
# before the fuses flip. On Intel macOS that includes the logged skip of the
# embed worker probe, since onnxruntime-node ships no darwin x64 binding.
#
# macOS: electron-builder skips signing on a pull request, and an unsigned
# arm64 binary whose fuses were flipped after packing is killed at launch. So
# this signs ad-hoc (`mac.identity: "-"`, no certificate) and allows it on pull
# requests with CSC_FOR_PULL_REQUEST. The job holds no secrets, which is what
# electron-builder's warning about that variable is about. build/afterSign.js
# then runs its spawn-helper gate on the hardened-runtime binary and skips
# notarization (no Apple credentials).
#
# Path-filtered and deliberately NOT a required check, like
# macos-spawn-helper.yml: ci.yml runs at the job cap (see the note at the top of
# that file), so these jobs queue rather than fail when they overlap a CI run.
# The filter covers what decides whether a packaged build launches: the packaging
# config and scripts, the forked processes' entries and their clients, and the
# code they share. package-lock.json carries every dependency change, so
# package.json is not in it.
#
# A pull request runs three legs. Linux arm64 and Intel macOS run nightly on main
# instead, with the other three, so a merge that breaks one surfaces by the next
# day, not on a tag. Their PR reds were runner faults: 7 of the 14 reruns the
# audit read were electron-builder's ETXTBSY on arm64, and none was a product bug
# (docs/audits/test-suite-audit.md). /release checks the nightly run before a tag.
# The Intel leg also gives back a macOS slot: the account has 5, and a lockfile PR
# filled all of them.

on:
  pull_request:
    branches: [main]
    paths:
      - 'electron-builder.yml'
      - 'build/**'
      - 'package-lock.json'
      - 'scripts/build.js'
      - 'scripts/copy-external-scripts.js'
      - 'scripts/package-smoke.mjs'
      - 'src/main/pty/host/**'
      - 'src/main/pty/process-tag/**'
      - 'src/main/pty/spawn/**'
      - 'src/main/pty/shutdown/**'
      - 'src/main/shutdown.ts'
      - 'src/main/retrieval/worker/**'
      - 'src/main/retrieval/retrieval-client.ts'
      - 'src/main/retrieval/vec-support.ts'
      - 'src/main/retrieval/vec-extension.ts'
      - 'src/main/utility-process/**'
      - 'src/main/shared/**'
      - 'src/main/db/database.ts'
      - 'src/main/config/paths.ts'
      - 'src/shared/embedding-runtime-gaps.json'
      - '.github/workflows/package-smoke.yml'
  schedule:
    # 03:17 UTC. Off the hour so it does not land in the cron rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

# Packages exactly what release.yml ships, so it skips onnxruntime-node's Linux x64 CUDA
# download the same way. The note at the top of ci.yml has the details.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One leg per release leg, on the same runner (release.yml's matrix), since
      # each target builds natively and loads its own arch's native packages. The two
      # excludes take those legs off a pull request; on any other event they match no
      # leg. A job-level `if:` cannot read the matrix, so this is the only way to keep
      # one literal list.
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest, macos-26-intel]
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04-arm' || 'no-such-leg' }}
          - os: ${{ github.event_name == 'pull_request' && 'macos-26-intel' || 'no-such-leg' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies (npm ci)
        run: npm ci
      # Sentry tokens empty on purpose: a local-shaped build, and build.js
      # prints that it skipped the symbol upload.
      - name: Package (electron-builder --dir)
        shell: bash
        run: npm run package -- --publish never ${{ runner.os == 'macOS' && '--config.mac.identity=-' || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          KANGENTIC_SENTRY_TOKEN: ''
          SENTRY_AUTH_TOKEN: ''
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify the ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(out/mac*/Kangentic.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::Expected one out/mac*/Kangentic.app, found ${#apps[@]}."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          echo "Signature verified on ${apps[0]}."
      - name: Run the packaged app
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}node scripts/package-smoke.mjs --scratch-root "$RUNNER_TEMP/package-smoke"
      - name: Upload the smoke scratch on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/package-smoke
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
