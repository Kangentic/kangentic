name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # When triggered manually, create and push the tag first.
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists, skipping creation"
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Input version (${{ inputs.version }}) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  # Create THE single draft release, before any platform build starts.
  #
  # electron-builder's GitHub publisher does a check-then-create with no locking:
  # getOrCreateRelease() lists releases, scans for a matching tag_name, and creates
  # a draft if it finds none (electron-publish/out/gitHubPublisher.js:55, verified
  # against electron-builder 26.8.1 - a caret range, so re-check the line numbers
  # after a bump). The three matrix legs each run `npm run publish` in parallel, so
  # on v0.35.0 all three listed before any had created, all three saw nothing, and
  # all three created a draft. GitHub permits duplicate drafts for one tag (a draft
  # binds no git ref), so all three succeeded and the release split three ways.
  #
  # Pre-creating the draft closes that: `needs:` is a hard barrier, so the draft
  # provably exists before any leg lists releases, and every leg then takes the
  # `if (release.draft) return release` branch at gitHubPublisher.js:66 and reuses
  # it. The legs upload disjoint filenames and never read-modify-write the release
  # object, so nothing else races.
  #
  # Deliberately carries no `environment:`: the matrix legs gate on the
  # release-<platform> environments, and a required reviewer or wait timer here
  # would stall draft creation for all three.
  create-draft-release:
    needs: [create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent, so a re-run reuses whatever already exists. Titled without the
      # leading "v" to match what electron-builder's own createRelease() produces.
      #
      # Page 1 only, unlike scripts/verify-release-assets.js, which pages to 20.
      # The tag being created is by definition among the newest releases, so it
      # cannot have fallen off page 1 here. The deeper paging matters only in the
      # verify gate, which must also SEE a duplicate to fail on it. If this check
      # ever did miss an existing release, the result is a second draft, and that
      # gate then fails the release rather than publishing a partial one.
      - name: Create the draft release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          existing=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$tag\")] | length")
          if [ "$existing" -gt 0 ]; then
            echo "A release already exists for $tag; reusing it."
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "${tag#v}" \
            --notes-file RELEASE_NOTES.md \
            --repo "${{ github.repository }}"

  release:
    needs: [create-tag, create-draft-release]
    # The create-draft-release clause is load-bearing. always() is present to
    # tolerate the conditional create-tag, which means adding a job to needs:
    # without also naming it here would let the matrix run when draft creation
    # FAILED, straight back to the three-way split this job exists to prevent.
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') && needs.create-draft-release.result == 'success'
    environment: release-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          # Tag push: github.ref is refs/tags/vX.Y.Z
          # workflow_dispatch: use the version tag directly
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      # Import Apple Developer ID certificate using Apple's official action.
      # Handles keychain creation, partition list, and default keychain setup.
      - name: Install Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify signing identity
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Default keychain:"
          security default-keychain
          echo "Signing identities:"
          security find-identity -v -p codesigning

      # Block OCSP/timestamp lookups that cause codesign to hang on CI.
      # OCSP is a soft failure -- blocking it makes codesign skip the check.
      - name: Block OCSP for codesign
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "127.0.0.1 ocsp.apple.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ocsp2.apple.com" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder

      - name: Build and publish
        run: npm run publish
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing (Windows custom sign script)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
          AZURE_SIGNING_ACCOUNT: sign-kangentic
          AZURE_CERT_PROFILE: kangentic-signing

      # Fail the build if app-update.yml is missing from the packaged app.
      # electron-updater reads this manifest on launch; if it's absent the
      # app raises ENOENT on every check and auto-update is silently broken.
      # See src/main/updater.ts:initUpdater for the runtime guard.
      - name: Verify app-update.yml is packaged (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -e
          missing=0
          shopt -s nullglob
          apps=(out/mac*/Kangentic.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No out/mac*/Kangentic.app found"
            exit 1
          fi
          for app in "${apps[@]}"; do
            manifest="$app/Contents/Resources/app-update.yml"
            if [ ! -f "$manifest" ]; then
              echo "::error::Missing $manifest"
              missing=1
            else
              echo "Found $manifest"
            fi
          done
          [ "$missing" = "0" ]

      - name: Verify app-update.yml is packaged (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $manifest = "out/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $manifest)) {
            Write-Error "Missing $manifest"
            exit 1
          }
          Write-Host "Found $manifest"

      # Linux needs a SECOND file the other platforms do not. electron-updater's
      # `autoUpdater` export picks between AppImageUpdater / DebUpdater /
      # RpmUpdater by reading `package-type` from resourcesPath; without it a
      # deb/rpm install silently falls back to AppImageUpdater and every install
      # fails. electron-builder writes both files together for any fpm target in
      # its supportsAutoUpdate list, so a missing one means the publish config
      # did not resolve at build time and Linux auto-update is dead on arrival.
      - name: Verify app-update.yml and package-type are packaged (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -e
          missing=0
          for file in app-update.yml package-type; do
            path="out/linux-unpacked/resources/$file"
            if [ ! -f "$path" ]; then
              echo "::error::Missing $path"
              missing=1
            else
              echo "Found $path"
            fi
          done
          [ "$missing" = "0" ]
          package_type=$(cat out/linux-unpacked/resources/package-type)
          case "$package_type" in
            deb|rpm|pacman) echo "package-type: $package_type" ;;
            *) echo "::error::Unexpected package-type '$package_type' (electron-updater maps only deb/rpm/pacman)"; exit 1 ;;
          esac

      # Actually installs the built .rpm/.deb on clean distro containers. A hand-maintained
      # dependency name can look correct and still fail on a real system - this is what would
      # have caught the libXShmfence bug (a package name no RPM distro has ever shipped) before
      # release. See .claude/rules/linux-package-dependencies.md.
      # Each distro is its OWN step so all four report independently. Chained under one `set -e`,
      # a failure in the first container aborts before the second ever runs, so a single CI run
      # could only ever prove the first distro of a pair - the gate would claim four-distro
      # coverage while delivering two.
      #
      # --nogpgcheck / --no-gpg-checks: electron-builder emits an UNSIGNED rpm. Fedora 45 flips
      # RPM's %_pkgverify_level from "digest" to "all", so without the override an unsigned local
      # package is refused outright and every release would fail here on a signature error rather
      # than on the dependency resolution this gate actually tests.
      - name: Verify rpm installs on Fedora
        if: matrix.platform == 'linux'
        run: |
          set -e
          rpm_file=$(ls out/kangentic-*.x86_64.rpm)
          echo "Testing $rpm_file"
          docker run --rm -v "$PWD/out:/out:ro" fedora:latest \
            dnf install -y --nogpgcheck "/out/$(basename "$rpm_file")"

      - name: Verify rpm installs on openSUSE
        if: matrix.platform == 'linux'
        run: |
          set -e
          rpm_file=$(ls out/kangentic-*.x86_64.rpm)
          echo "Testing $rpm_file"
          docker run --rm -v "$PWD/out:/out:ro" opensuse/tumbleweed:latest \
            zypper --non-interactive --no-gpg-checks install "/out/$(basename "$rpm_file")"

      - name: Verify deb installs on Debian
        if: matrix.platform == 'linux'
        run: |
          set -e
          deb_file=$(ls out/kangentic_*_amd64.deb)
          echo "Testing $deb_file"
          docker run --rm -v "$PWD/out:/out:ro" debian:stable sh -c \
            "apt-get update -qq && apt-get install -y \"/out/$(basename "$deb_file")\""

      - name: Verify deb installs on Ubuntu
        if: matrix.platform == 'linux'
        run: |
          set -e
          deb_file=$(ls out/kangentic_*_amd64.deb)
          echo "Testing $deb_file"
          docker run --rm -v "$PWD/out:/out:ro" ubuntu:24.04 sh -c \
            "apt-get update -qq && apt-get install -y \"/out/$(basename "$deb_file")\""

      # The four steps above prove a FRESH install. Upgrading is the primary path
      # now that electron-updater installs the new package over the running one
      # (src/main/updater.ts no longer bails out on Linux), and an upgrade can
      # fail where a fresh install succeeds: file conflicts between versions,
      # scriptlet ordering, or a dependency only the old package pulled in.
      #
      # `/releases/latest` returns the PREVIOUS release here - the one being built
      # is still a draft at this point and the API skips drafts - so this upgrades
      # from exactly what users are running today.
      #
      # Skipping is deliberately narrow: only "there is no published release to
      # upgrade FROM" skips, which happens once, on the first release ever. A
      # baseline that exists but whose package cannot be downloaded FAILS,
      # because the only ways that happens are an incomplete previous release or
      # an artifact rename - and a gate that silently stops testing on a rename
      # is worse than no gate, since it still reads as coverage.
      - name: Verify rpm upgrades from the previous release
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticated, and branching on the HTTP status rather than on curl's
          # exit code. Unauthenticated api.github.com is 60 req/hour per runner IP
          # and shared with every other job on that host, so a bare `if curl` folds
          # a 403 into the same empty-tag branch as "no release exists" and skips
          # the gate while reporting green. Only a real 404 may skip.
          status=$(curl -sSL -o /tmp/prev-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          if [ "$status" = "404" ]; then
            echo "No previously published release found; skipping rpm upgrade check."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GitHub API returned HTTP $status resolving the previous release."
            echo "::error::Refusing to skip the upgrade check on a transport failure - that would report green without testing anything."
            exit 1
          fi
          prev_tag=$(jq -r '.tag_name // empty' /tmp/prev-release.json)
          if [ -z "$prev_tag" ]; then
            echo "::error::Release API returned HTTP 200 with no tag_name."
            exit 1
          fi
          prev_version="${prev_tag#v}"
          prev_file="kangentic-${prev_version}-1.x86_64.rpm"
          mkdir -p prev
          if ! curl -fsSL -o "prev/$prev_file" "https://github.com/${{ github.repository }}/releases/download/${prev_tag}/${prev_file}"; then
            echo "::error::$prev_file is missing from release $prev_tag."
            echo "::error::Either that release is incomplete, or the rpm artifact naming changed - which would also break the npx launcher (packages/launcher/bin/kangentic.js builds this exact filename)."
            exit 1
          fi
          # Assigned in two steps, not `basename "$(ls ...)"`: with the ls nested
          # inside basename's argument the assignment carries BASENAME's exit
          # status, so a zero-match glob sails past `set -e` with new_file empty
          # and fails later as an opaque docker error. Direct assignment aborts
          # here, matching the fresh-install steps above.
          rpm_path=$(ls out/kangentic-*-1.x86_64.rpm)
          new_file=$(basename "$rpm_path")
          new_version=$(echo "$new_file" | sed -E 's/^kangentic-(.+)-1\.x86_64\.rpm$/\1/')
          echo "Upgrading rpm $prev_version -> $new_version"
          # `rpm -q kangentic-$new_version` asks for that exact name-version rather
          # than grepping the full NVR, where an unanchored pattern would let the
          # version's dots match any character.
          docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/prev:/prev:ro" fedora:latest sh -c \
            "dnf install -y --nogpgcheck /prev/$prev_file && dnf install -y --nogpgcheck /out/$new_file && rpm -q kangentic-$new_version"

      - name: Verify deb upgrades from the previous release
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same status-code branching as the rpm step above: only a real 404 skips.
          status=$(curl -sSL -o /tmp/prev-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          if [ "$status" = "404" ]; then
            echo "No previously published release found; skipping deb upgrade check."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GitHub API returned HTTP $status resolving the previous release."
            echo "::error::Refusing to skip the upgrade check on a transport failure - that would report green without testing anything."
            exit 1
          fi
          prev_tag=$(jq -r '.tag_name // empty' /tmp/prev-release.json)
          if [ -z "$prev_tag" ]; then
            echo "::error::Release API returned HTTP 200 with no tag_name."
            exit 1
          fi
          prev_version="${prev_tag#v}"
          prev_file="kangentic_${prev_version}_amd64.deb"
          mkdir -p prev
          if ! curl -fsSL -o "prev/$prev_file" "https://github.com/${{ github.repository }}/releases/download/${prev_tag}/${prev_file}"; then
            echo "::error::$prev_file is missing from release $prev_tag."
            echo "::error::Either that release is incomplete, or the deb artifact naming changed - which would also break the npx launcher (packages/launcher/bin/kangentic.js builds this exact filename)."
            exit 1
          fi
          # Two-step assignment for the same set -e reason as the rpm step above.
          deb_path=$(ls out/kangentic_*_amd64.deb)
          new_file=$(basename "$deb_path")
          new_version=$(echo "$new_file" | sed -E 's/^kangentic_(.+)_amd64\.deb$/\1/')
          echo "Upgrading deb $prev_version -> $new_version"
          # -xF: whole-line fixed-string, so the installed version must equal the
          # new one rather than merely contain a regex that matches it.
          docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/prev:/prev:ro" debian:stable sh -c \
            "apt-get update -qq && apt-get install -y /prev/$prev_file && apt-get install -y /out/$new_file && dpkg-query -W -f='\${Version}' kangentic | grep -qxF '$new_version'"

  # Publish the draft release, but only after verifying what is actually attached
  # to it.
  #
  # The needs.release.result == 'success' gate is necessary and not sufficient. On
  # v0.35.0 every platform job DID succeed and the release still shipped Windows-
  # only, because the artifacts landed on three separate release objects and this
  # job published one of them. Build success says nothing about what is attached to
  # the release being published, so the asset-manifest check below is the gate that
  # actually prevents a partial release. A failure here leaves the release a draft.
  #
  # Publishing (--draft=false) and setting the notes body happen in the SAME
  # `gh release edit` call so the release is never live with an empty body:
  # two separate calls (draft=false, then --notes-file) left a window where
  # the release was published and discoverable with no body for the
  # duration of a whole job.
  publish-release:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Must run BEFORE --draft=false: a failure here has to leave the release
      # unpublished rather than roll one back.
      - name: Verify the release carries every expected asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-assets.js "${{ steps.version.outputs.tag }}" --repo ${{ github.repository }}

      - name: Publish release with notes (remove draft status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --notes-file RELEASE_NOTES.md --repo ${{ github.repository }}

  publish-npm:
    needs: [publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 24 ships npm 11.16+,
      # so this job pins Node 24 and skips the `npm install -g npm@latest`
      # self-upgrade. That self-upgrade tracked whatever npm@latest shipped that
      # day; a bad build pruned the bundled `sigstore` module and broke
      # provenance publishing (the v0.29.0 release failure). This job builds no
      # Electron, so it is isolated from the Node-22 pin the platform build jobs
      # require.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Idempotent: re-running an already-published tag (e.g. backfilling a green
      # run after a transient failure) must not fail on npm's "cannot publish
      # over the previously published version". Skip when the version is already
      # on the registry so the re-run stays green.
      - name: Publish launcher to npm
        run: |
          PUBLISHED_VERSION=$(node -p "require('./packages/launcher/package.json').version")
          if npm view "kangentic@$PUBLISHED_VERSION" version >/dev/null 2>&1; then
            echo "kangentic@$PUBLISHED_VERSION is already on npm; skipping publish (idempotent re-run)."
            exit 0
          fi
          npm publish --access public --provenance -w packages/launcher

  # @kangentic/protocol is published by its OWN independent workflow
  # (publish-protocol.yml), NOT here. Its version is deliberately decoupled
  # from Kangentic's own version (see that workflow's header comment) so the
  # protocol package can ship on its own cadence -- including while the
  # mobile bridge feature is still being built out -- without requiring or
  # triggering a full Kangentic desktop release. Do not re-add a protocol
  # publish step to this job; that reintroduces the lockstep coupling this
  # split was built to remove.
