name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # When triggered manually, create and push the tag first.
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists, skipping creation"
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Input version (${{ inputs.version }}) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  # Prove the Sentry upload token exists BEFORE anything is built or drafted.
  #
  # v0.38.0 and v0.37.0 both shipped with zero sourcemaps and zero native debug
  # files, because the KANGENTIC_SENTRY_TOKEN secret was never created. An unset
  # secret expands to the empty string, both build gates read falsy, and the
  # uploads no-opped in total silence: the v0.38.0 build log contains no Sentry
  # line at all. Every release since error reporting landed has therefore
  # produced minified renderer frames with no maps to resolve them (DESKTOP-D)
  # and native crashes with no PDBs (DESKTOP-C had to be symbolicated by hand).
  #
  # This job is the same judgement the rpm and deb upgrade gates below already
  # make: a step that silently stops doing its job is worse than no step, since
  # it still reads as coverage. Runs in seconds, before the 90-minute matrix.
  #
  # Deliberately carries no `environment:`, for the same reason
  # create-draft-release does not: a required reviewer or wait timer here would
  # stall the whole release on an approval gate.
  preflight-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Sentry symbol-upload token
        env:
          KANGENTIC_SENTRY_TOKEN: ${{ secrets.KANGENTIC_SENTRY_TOKEN }}
        run: |
          if [ -z "${KANGENTIC_SENTRY_TOKEN}" ]; then
            echo "::error::KANGENTIC_SENTRY_TOKEN is not set, so this release would ship with no sourcemaps and no native debug files."
            echo "::error::Add it as a repository secret on this repo. Repo scope is enough; all three release-<platform> environments inherit it."
            echo "::error::The token needs the project:releases and project:write scopes."
            exit 1
          fi
          echo "Sentry symbol-upload token is present."

  # Create THE single draft release, before any platform build starts.
  #
  # electron-builder's GitHub publisher does a check-then-create with no locking:
  # getOrCreateRelease() lists releases, scans for a matching tag_name, and creates
  # a draft if it finds none (electron-publish/out/gitHubPublisher.js:55, verified
  # against electron-builder 26.8.1 - a caret range, so re-check the line numbers
  # after a bump). The three matrix legs each run `npm run publish` in parallel, so
  # on v0.35.0 all three listed before any had created, all three saw nothing, and
  # all three created a draft. GitHub permits duplicate drafts for one tag (a draft
  # binds no git ref), so all three succeeded and the release split three ways.
  #
  # Pre-creating the draft closes that: `needs:` is a hard barrier, so the draft
  # provably exists before any leg lists releases, and every leg then takes the
  # `if (release.draft) return release` branch at gitHubPublisher.js:66 and reuses
  # it. The legs upload disjoint filenames and never read-modify-write the release
  # object, so nothing else races.
  #
  # Deliberately carries no `environment:`: the matrix legs gate on the
  # release-<platform> environments, and a required reviewer or wait timer here
  # would stall draft creation for all three.
  # The preflight-symbols clause is load-bearing in BOTH halves, exactly like the
  # create-draft-release clause on the `release` job below. always() is here to
  # tolerate the conditional create-tag, and it also defeats the implicit
  # "skip me if a dependency failed" behaviour - so a job named in `needs:` but
  # not in `if:` would still run when that dependency FAILED. Gating the draft
  # (rather than only the matrix) is what keeps a failed preflight from leaving
  # an orphaned draft release behind; the `release` job then inherits the gate
  # through its existing create-draft-release clause.
  create-draft-release:
    needs: [create-tag, preflight-symbols]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') && needs.preflight-symbols.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent, so a re-run reuses whatever already exists. Titled without the
      # leading "v" to match what electron-builder's own createRelease() produces.
      #
      # "A release exists for this tag" is three situations, not one, and the split
      # is load-bearing. electron-builder uploads only into a DRAFT: handed a
      # PUBLISHED release for the tag it logs `existing type not compatible with
      # publishing type` and skips every artifact, while the build still exits 0.
      # That is how v0.39.0 came to sit published and empty after its draft was
      # published by hand mid-run, and the first thing to notice was a downstream
      # gate whose error named the wrong cause. So a published-but-incomplete
      # release fails HERE, in seconds, naming the recovery, rather than after
      # three platform builds have run for nothing.
      #
      # A published and COMPLETE release is the opposite case and must stay green:
      # that is the idempotent re-run this workflow supports on purpose (publish-npm
      # carries the matching skip). verify-release-assets.js is the single
      # definition of "complete" and is what publish-release already trusts, so it
      # is called here rather than reimplemented as an asset count in bash.
      #
      # Page 1 only, unlike scripts/verify-release-assets.js, which pages to 20.
      # The tag being created is by definition among the newest releases, so it
      # cannot have fallen off page 1 here. The deeper paging matters only in the
      # verify gate, which must also SEE a duplicate to fail on it. If this check
      # ever did miss an existing release, the result is a second draft, and that
      # gate then fails the release rather than publishing a partial one.
      - name: Create the draft release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # `--arg tag`, not the tag spliced into the jq program text. A ref name may legally
          # contain a double quote, which would close the jq string early and abort the step on
          # a parse error instead of on anything meaningful. gh api's own --jq takes no --arg,
          # so the filter runs in a separate jq, which is the form both upgrade gates use.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            | jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)]' > /tmp/tag-releases.json
          existing=$(jq 'length' /tmp/tag-releases.json)
          if [ "$existing" -eq 0 ]; then
            gh release create "$tag" \
              --draft \
              --title "${tag#v}" \
              --notes-file RELEASE_NOTES.md \
              --repo "${{ github.repository }}"
            echo "Created the draft release for $tag."
            exit 0
          fi
          if [ "$(jq '[.[] | select(.draft)] | length' /tmp/tag-releases.json)" -gt 0 ]; then
            echo "A draft release already exists for $tag; reusing it."
            exit 0
          fi
          # On a failure the script prints its own trailer, "Refusing to publish. The release
          # stays a draft." That is written for publish-release and is wrong here: this release
          # is already published. The ::error:: lines below are the authoritative ones, and are
          # what GitHub surfaces at the top of the run.
          #
          # Those lines name the three causes rather than asserting one, because a non-zero exit
          # here does not identify which it was. `releasesForTag` runs `gh api` through
          # execFileSync with no try/catch, so an unreachable API throws and exits 1 exactly like
          # a verified-incomplete release does, and a tag resolving to SEVERAL release objects
          # exits 1 too, where the fix is deleting the extras rather than this tag. A single
          # message asserting "incomplete, so delete it" is confidently wrong in two of the three
          # cases, and it is wrong in the direction that destroys a good release.
          if node scripts/verify-release-assets.js "$tag" --repo "${{ github.repository }}"; then
            echo "$tag is already published and carries every expected asset; re-running over a finished release."
            exit 0
          fi
          echo "::error::$tag is already PUBLISHED and scripts/verify-release-assets.js did not pass on it."
          echo "::error::Building into it is not an option either way: electron-builder uploads only into a draft, so it would skip every artifact with 'existing type not compatible with publishing type' while all three builds still reported success."
          echo "::error::This step cannot tell the three causes apart, so read the verification output above before acting."
          echo "::error::If it could not reach the GitHub API, re-run this workflow and delete nothing."
          echo "::error::If it found more than one release object for $tag, consolidate the assets onto one and delete the EXTRAS, not $tag itself."
          echo "::error::If it found one published release genuinely missing assets, run 'gh release delete $tag --yes' (the tag survives) and then re-run this entire workflow."
          echo "::error::Never publish the draft by hand while the builds are running."
          exit 1

  release:
    needs: [create-tag, create-draft-release]
    # The create-draft-release clause is load-bearing. always() is present to
    # tolerate the conditional create-tag, which means adding a job to needs:
    # without also naming it here would let the matrix run when draft creation
    # FAILED, straight back to the three-way split this job exists to prevent.
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') && needs.create-draft-release.result == 'success'
    environment: release-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          # Tag push: github.ref is refs/tags/vX.Y.Z
          # workflow_dispatch: use the version tag directly
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # Import Apple Developer ID certificate using Apple's official action.
      # Handles keychain creation, partition list, and default keychain setup.
      - name: Install Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify signing identity
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Default keychain:"
          security default-keychain
          echo "Signing identities:"
          security find-identity -v -p codesigning

      # Block OCSP/timestamp lookups that cause codesign to hang on CI.
      # OCSP is a soft failure -- blocking it makes codesign skip the check.
      - name: Block OCSP for codesign
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "127.0.0.1 ocsp.apple.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ocsp2.apple.com" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder

      - name: Build and publish
        run: npm run publish
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
          # Sentry release symbolication: sourcemaps (scripts/build.js,
          # vite.config.mts) and node-pty's Windows PDBs (scripts/build.js).
          # The preflight-symbols job has already proven this is non-empty, and
          # with it set every upload failure now fails the build rather than
          # warning past it, so "the job went green" means the symbols landed.
          KANGENTIC_SENTRY_TOKEN: ${{ secrets.KANGENTIC_SENTRY_TOKEN }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing (Windows custom sign script)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
          AZURE_SIGNING_ACCOUNT: sign-kangentic
          AZURE_CERT_PROFILE: kangentic-signing

      # Fail the build if app-update.yml is missing from the packaged app.
      # electron-updater reads this manifest on launch; if it's absent the
      # app raises ENOENT on every check and auto-update is silently broken.
      # See src/main/updater.ts:initUpdater for the runtime guard.
      - name: Verify app-update.yml is packaged (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -e
          missing=0
          shopt -s nullglob
          apps=(out/mac*/Kangentic.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No out/mac*/Kangentic.app found"
            exit 1
          fi
          for app in "${apps[@]}"; do
            manifest="$app/Contents/Resources/app-update.yml"
            if [ ! -f "$manifest" ]; then
              echo "::error::Missing $manifest"
              missing=1
            else
              echo "Found $manifest"
            fi
          done
          [ "$missing" = "0" ]

      - name: Verify app-update.yml is packaged (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $manifest = "out/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $manifest)) {
            Write-Error "Missing $manifest"
            exit 1
          }
          Write-Host "Found $manifest"

      # Linux needs a SECOND file the other platforms do not. electron-updater's
      # `autoUpdater` export picks between AppImageUpdater / DebUpdater /
      # RpmUpdater by reading `package-type` from resourcesPath; without it a
      # deb/rpm install silently falls back to AppImageUpdater and every install
      # fails. electron-builder writes both files together for any fpm target in
      # its supportsAutoUpdate list, so a missing one means the publish config
      # did not resolve at build time and Linux auto-update is dead on arrival.
      - name: Verify app-update.yml and package-type are packaged (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -e
          missing=0
          for file in app-update.yml package-type; do
            path="out/linux-unpacked/resources/$file"
            if [ ! -f "$path" ]; then
              echo "::error::Missing $path"
              missing=1
            else
              echo "Found $path"
            fi
          done
          [ "$missing" = "0" ]
          package_type=$(cat out/linux-unpacked/resources/package-type)
          case "$package_type" in
            deb|rpm|pacman) echo "package-type: $package_type" ;;
            *) echo "::error::Unexpected package-type '$package_type' (electron-updater maps only deb/rpm/pacman)"; exit 1 ;;
          esac

      # Actually installs the built .rpm/.deb on clean distro containers. A hand-maintained
      # dependency name can look correct and still fail on a real system - this is what would
      # have caught the libXShmfence bug (a package name no RPM distro has ever shipped) before
      # release. See .claude/rules/linux-package-dependencies.md.
      # Each distro is its OWN step so all four report independently. Chained under one `set -e`,
      # a failure in the first container aborts before the second ever runs, so a single CI run
      # could only ever prove the first distro of a pair - the gate would claim four-distro
      # coverage while delivering two.
      #
      # --nogpgcheck / --no-gpg-checks: electron-builder emits an UNSIGNED rpm. Fedora 45 flips
      # RPM's %_pkgverify_level from "digest" to "all", so without the override an unsigned local
      # package is refused outright and every release would fail here on a signature error rather
      # than on the dependency resolution this gate actually tests.
      - name: Verify rpm installs on Fedora
        if: matrix.platform == 'linux'
        run: |
          set -e
          rpm_file=$(ls out/kangentic-*.x86_64.rpm)
          echo "Testing $rpm_file"
          docker run --rm -v "$PWD/out:/out:ro" fedora:latest \
            dnf install -y --nogpgcheck "/out/$(basename "$rpm_file")"

      - name: Verify rpm installs on openSUSE
        if: matrix.platform == 'linux'
        run: |
          set -e
          rpm_file=$(ls out/kangentic-*.x86_64.rpm)
          echo "Testing $rpm_file"
          docker run --rm -v "$PWD/out:/out:ro" opensuse/tumbleweed:latest \
            zypper --non-interactive --no-gpg-checks install "/out/$(basename "$rpm_file")"

      - name: Verify deb installs on Debian
        if: matrix.platform == 'linux'
        run: |
          set -e
          deb_file=$(ls out/kangentic_*_amd64.deb)
          echo "Testing $deb_file"
          docker run --rm -v "$PWD/out:/out:ro" debian:stable sh -c \
            "apt-get update -qq && apt-get install -y \"/out/$(basename "$deb_file")\""

      - name: Verify deb installs on Ubuntu
        if: matrix.platform == 'linux'
        run: |
          set -e
          deb_file=$(ls out/kangentic_*_amd64.deb)
          echo "Testing $deb_file"
          docker run --rm -v "$PWD/out:/out:ro" ubuntu:24.04 sh -c \
            "apt-get update -qq && apt-get install -y \"/out/$(basename "$deb_file")\""

      # The four steps above prove a FRESH install. Upgrading is the primary path
      # now that electron-updater installs the new package over the running one
      # (src/main/updater.ts no longer bails out on Linux), and an upgrade can
      # fail where a fresh install succeeds: file conflicts between versions,
      # scriptlet ordering, or a dependency only the old package pulled in.
      #
      # The baseline is the newest published release whose version is LOWER than
      # this build's, so it upgrades from what users are running today. It read
      # /releases/latest until v0.39.0, on the reasoning that the release being
      # built is still a draft and that endpoint skips drafts. That is true only
      # while nothing has published it, and both a re-run of a finished release and
      # a hand publish mid-run break it - after which the gate upgraded a version
      # from itself and passed without testing anything. Until v0.40.0 it then took
      # the newest published tag that was not its own, which is the same defect one
      # release later: re-run an older tag after a newer version has shipped and
      # the "upgrade" is a downgrade. See the baseline lookup below.
      #
      # Skipping is deliberately narrow: only "there is no published release older
      # than this one to upgrade FROM" skips, which happens once, on the first
      # release ever. A baseline that exists but whose package cannot be downloaded
      # FAILS, because the only ways that happens are an incomplete previous release
      # or an artifact rename - and a gate that silently stops testing on a rename
      # is worse than no gate, since it still reads as coverage.
      - name: Verify rpm upgrades from the previous release
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # What we just built is resolved FIRST, because the baseline lookup below
          # has to exclude it by name.
          #
          # Assigned in two steps, not `basename "$(ls ...)"`: with the ls nested
          # inside basename's argument the assignment carries BASENAME's exit
          # status, so a zero-match glob sails past `set -e` with new_file empty
          # and fails later as an opaque docker error. Direct assignment aborts
          # here, matching the fresh-install steps above.
          rpm_path=$(ls out/kangentic-*-1.x86_64.rpm)
          new_file=$(basename "$rpm_path")
          new_version=$(echo "$new_file" | sed -E 's/^kangentic-(.+)-1\.x86_64\.rpm$/\1/')
          # The baseline lookup below feeds $new_version through jq's tonumber. The tags it
          # reads from the API get a regex gate first; this one is the build's own version and
          # cannot be dropped the same way, because dropping it would leave nothing to compare
          # against and skip the gate. So assert it instead: every other failure in this step
          # names its cause, and without this one a non-triple version aborts on jq's raw
          # "Cannot parse" text with no hint of where it came from.
          if ! printf '%s' "$new_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Built version '$new_version' is not a plain X.Y.Z, so the upgrade baseline cannot be resolved by comparing versions."
            exit 1
          fi
          # Authenticated, and branching on the HTTP status rather than on curl's
          # exit code. Unauthenticated api.github.com is 60 req/hour per runner IP
          # and shared with every other job on that host, so a bare `if curl` folds
          # a 403 into the same empty-list branch as "no release exists" and skips
          # the gate while reporting green.
          status=$(curl -sSL -o /tmp/releases.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          if [ "$status" != "200" ]; then
            echo "::error::GitHub API returned HTTP $status listing releases."
            echo "::error::Refusing to skip the upgrade check on a transport failure - that would report green without testing anything."
            exit 1
          fi
          # Excluding this build's OWN tag is necessary and not sufficient. Until
          # v0.39.0 this read /releases/latest, which returns the release under
          # construction the moment anything publishes it, so a re-run upgraded a
          # version from itself. Until v0.40.0 it took the newest published tag that
          # was not its own, which is the same defect one release later: re-run
          # v0.39.1 after v0.40.0 has shipped and the baseline is v0.40.0, so the
          # "upgrade" is a DOWNGRADE. That is what the 2026-09-10 tag scrub did to
          # v0.39.0 and v0.39.1 when it force-pushed their tags and re-ran all three
          # releases. The baseline is therefore the newest published release whose
          # version is numerically LOWER than this build's.
          #
          # max_by, not [0]. The list endpoint orders by release-object creation,
          # not by version, and the documented recovery (gh release delete, then a
          # full re-run) re-creates a release object for an OLD tag, which then
          # sits first. [0] would hand a later build that re-created old release as
          # its baseline.
          #
          # Compared as numeric arrays, not strings: "v0.9.1" > "v0.10.0" as text.
          # A tag that is not a plain vX.Y.Z (an -rc suffix without the prerelease
          # flag, a protocol-v* tag if one ever becomes a release) cannot be
          # compared, so the regex gate drops it BEFORE tonumber sees it and the
          # log below names it, rather than the step aborting on a parse error.
          prev_tag=$(jq -r --arg self "v$new_version" \
            'def ver: ltrimstr("v") | split(".") | map(tonumber); [.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | select((.tag_name | ver) < ($self | ver))] | max_by(.tag_name | ver) | .tag_name // empty' \
            /tmp/releases.json)
          ignored_tags=$(jq -r \
            '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$") | not) | .tag_name] | join(" ")' \
            /tmp/releases.json)
          if [ -n "$ignored_tags" ]; then
            echo "Ignoring published release(s) whose tag is not a plain vX.Y.Z, so its version cannot be compared: $ignored_tags"
          fi
          # Narrow on purpose: only "there is no published release older than this
          # one to upgrade FROM" skips. A baseline that exists but whose package
          # cannot be downloaded still FAILS below.
          if [ -z "$prev_tag" ]; then
            # The total is printed because the filter matching nothing has two very different
            # causes and this step cannot tell them apart: no baseline exists yet (correct, and
            # true exactly once), or the filter is broken against a full release history. jq
            # returns null for an unknown field rather than erroring, so a later typo in
            # .draft / .prerelease / .tag_name would skip forever and still read as coverage.
            # A count next to the skip line is what lets whoever reads the log see which it was.
            echo "No published release older than v$new_version; skipping rpm upgrade check. The API returned $(jq 'length' /tmp/releases.json) release(s) in total."
            exit 0
          fi
          prev_version="${prev_tag#v}"
          prev_file="kangentic-${prev_version}-1.x86_64.rpm"
          mkdir -p prev
          if ! curl -fsSL -o "prev/$prev_file" "https://github.com/${{ github.repository }}/releases/download/${prev_tag}/${prev_file}"; then
            echo "::error::$prev_file is missing from release $prev_tag."
            echo "::error::Either that release is incomplete, or the rpm artifact naming changed - which would also break the npx launcher (packages/launcher/bin/kangentic.js builds this exact filename)."
            exit 1
          fi
          echo "Upgrading rpm $prev_version -> $new_version"
          # `rpm -q kangentic-$new_version` asks for that exact name-version rather
          # than grepping the full NVR, where an unanchored pattern would let the
          # version's dots match any character.
          #
          # dnf cannot catch a wrong baseline. Handed a local rpm with a LOWER
          # version, `dnf install` downgrades without complaint ("Downgrading:
          # kangentic 0.39.1-1 replacing 0.40.0-1 ... Complete!"), and `rpm -q`
          # then confirms the downgrade. So the assertion here proves only that the
          # new package is what ended up installed; the baseline lookup above is
          # what makes it an upgrade. apt does refuse (exit 100, "Packages were
          # downgraded and -y was used without --allow-downgrades"), which is how
          # the 2026-09-10 re-runs went red on deb and silently green on rpm.
          docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/prev:/prev:ro" fedora:latest sh -c \
            "dnf install -y --nogpgcheck /prev/$prev_file && dnf install -y --nogpgcheck /out/$new_file && rpm -q kangentic-$new_version"

      - name: Verify deb upgrades from the previous release
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Built version first, then the baseline whose version is lower than it - same
          # ordering and same reasons as the rpm step above.
          # Two-step assignment for the same set -e reason as the rpm step above.
          deb_path=$(ls out/kangentic_*_amd64.deb)
          new_file=$(basename "$deb_path")
          new_version=$(echo "$new_file" | sed -E 's/^kangentic_(.+)_amd64\.deb$/\1/')
          # Same assertion as the rpm step above, and for the same reason: the baseline lookup
          # parses this version numerically, so a non-triple has to name itself here rather
          # than surface as a jq parse error.
          if ! printf '%s' "$new_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Built version '$new_version' is not a plain X.Y.Z, so the upgrade baseline cannot be resolved by comparing versions."
            exit 1
          fi
          # Same status-code branching as the rpm step above: a transport failure
          # fails rather than skipping.
          status=$(curl -sSL -o /tmp/releases.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          if [ "$status" != "200" ]; then
            echo "::error::GitHub API returned HTTP $status listing releases."
            echo "::error::Refusing to skip the upgrade check on a transport failure - that would report green without testing anything."
            exit 1
          fi
          # The newest published release whose version is numerically LOWER than
          # this build's, so neither a re-run of a finished release nor a re-run of
          # an OLDER tag after a newer one shipped can hand this gate itself or a
          # downgrade as the baseline. Same program as the rpm step, which carries
          # the full reasoning.
          prev_tag=$(jq -r --arg self "v$new_version" \
            'def ver: ltrimstr("v") | split(".") | map(tonumber); [.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | select((.tag_name | ver) < ($self | ver))] | max_by(.tag_name | ver) | .tag_name // empty' \
            /tmp/releases.json)
          ignored_tags=$(jq -r \
            '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$") | not) | .tag_name] | join(" ")' \
            /tmp/releases.json)
          if [ -n "$ignored_tags" ]; then
            echo "Ignoring published release(s) whose tag is not a plain vX.Y.Z, so its version cannot be compared: $ignored_tags"
          fi
          if [ -z "$prev_tag" ]; then
            # Prints the total for the same reason as the rpm step above: an empty filter result
            # means either "no baseline exists yet" or "the filter is broken", and only the log
            # can tell them apart.
            echo "No published release older than v$new_version; skipping deb upgrade check. The API returned $(jq 'length' /tmp/releases.json) release(s) in total."
            exit 0
          fi
          prev_version="${prev_tag#v}"
          prev_file="kangentic_${prev_version}_amd64.deb"
          mkdir -p prev
          if ! curl -fsSL -o "prev/$prev_file" "https://github.com/${{ github.repository }}/releases/download/${prev_tag}/${prev_file}"; then
            echo "::error::$prev_file is missing from release $prev_tag."
            echo "::error::Either that release is incomplete, or the deb artifact naming changed - which would also break the npx launcher (packages/launcher/bin/kangentic.js builds this exact filename)."
            exit 1
          fi
          echo "Upgrading deb $prev_version -> $new_version"
          # -xF: whole-line fixed-string, so the installed version must equal the
          # new one rather than merely contain a regex that matches it.
          docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/prev:/prev:ro" debian:stable sh -c \
            "apt-get update -qq && apt-get install -y /prev/$prev_file && apt-get install -y /out/$new_file && dpkg-query -W -f='\${Version}' kangentic | grep -qxF '$new_version'"

  # Publish the draft release, but only after verifying what is actually attached
  # to it.
  #
  # The needs.release.result == 'success' gate is necessary and not sufficient. On
  # v0.35.0 every platform job DID succeed and the release still shipped Windows-
  # only, because the artifacts landed on three separate release objects and this
  # job published one of them. Build success says nothing about what is attached to
  # the release being published, so the asset-manifest check below is the gate that
  # actually prevents a partial release. A failure here leaves the release a draft.
  #
  # Publishing (--draft=false) and setting the notes body happen in the SAME
  # `gh release edit` call so the release is never live with an empty body:
  # two separate calls (draft=false, then --notes-file) left a window where
  # the release was published and discoverable with no body for the
  # duration of a whole job.
  publish-release:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Must run BEFORE --draft=false: a failure here has to leave the release
      # unpublished rather than roll one back.
      - name: Verify the release carries every expected asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-assets.js "${{ steps.version.outputs.tag }}" --repo ${{ github.repository }}

      - name: Publish release with notes (remove draft status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --notes-file RELEASE_NOTES.md --repo ${{ github.repository }}

  publish-npm:
    needs: [publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 24 ships npm 11.16+,
      # so this job pins Node 24 and skips the `npm install -g npm@latest`
      # self-upgrade. That self-upgrade tracked whatever npm@latest shipped that
      # day; a bad build pruned the bundled `sigstore` module and broke
      # provenance publishing (the v0.29.0 release failure). This job builds no
      # Electron, so it is isolated from the Node-22 pin the platform build jobs
      # require.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Idempotent: re-running an already-published tag (e.g. backfilling a green
      # run after a transient failure) must not fail on npm's "cannot publish
      # over the previously published version". Skip when the version is already
      # on the registry so the re-run stays green.
      - name: Publish launcher to npm
        run: |
          PUBLISHED_VERSION=$(node -p "require('./packages/launcher/package.json').version")
          if npm view "kangentic@$PUBLISHED_VERSION" version >/dev/null 2>&1; then
            echo "kangentic@$PUBLISHED_VERSION is already on npm; skipping publish (idempotent re-run)."
            exit 0
          fi
          npm publish --access public --provenance -w packages/launcher

  # @kangentic/protocol is published by its OWN independent workflow
  # (publish-protocol.yml), NOT here. Its version is deliberately decoupled
  # from Kangentic's own version (see that workflow's header comment) so the
  # protocol package can ship on its own cadence -- including while the
  # mobile bridge feature is still being built out -- without requiring or
  # triggering a full Kangentic desktop release. Do not re-add a protocol
  # publish step to this job; that reintroduces the lockstep coupling this
  # split was built to remove.
