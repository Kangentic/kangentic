name: Shell quoting against real nushell and fish

# The POSIX sibling of shell-quoting-windows.yml. nushell and fish are in the
# shell picker on macOS and Linux, and neither quotes like POSIX sh: nushell's
# single-quoted strings have no escapes, so they cannot hold an apostrophe, and
# fish reads `\\` and `\'` inside its single quotes. quoteArg has a branch for
# each, and this job types real command lines into both shells and reads back
# the argv a node process received (typeAtPosixShell in
# tests/unit/helpers/shell-argv-probe.ts). CI's unit tier has neither shell, so
# it skips that block and checks only the string pins.
#
# Path-filtered, and deliberately NOT a required check, for the reason
# shell-quoting-windows.yml gives: ci.yml runs at the job cap, and this only has something to say when the escapes, the code that builds the
# quoted line, or these tests change.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/shared/shell-quote.ts'
      - 'src/shared/paths.ts'
      - 'src/main/agent/adapters/claude/command-builder.ts'
      - 'src/main/agent/adapters/codex/command-builder.ts'
      - 'src/main/agent/adapters/codex/hook-manager.ts'
      - 'src/main/pty/spawn/typed-launch.ts'
      - 'tests/unit/typed-launch-round-trip.test.ts'
      - 'tests/unit/helpers/shell-argv-probe.ts'
      - 'tests/unit/command-builder.test.ts'
      - 'tests/unit/shell-quote.test.ts'
      - 'tests/unit/codex-hook-overrides.test.ts'
      - 'vitest.config.mts'
      - '.github/workflows/shell-quoting-posix.yml'
  push:
    branches: [main]
    paths:
      - 'src/shared/shell-quote.ts'
      - 'src/shared/paths.ts'
      - 'src/main/agent/adapters/claude/command-builder.ts'
      - 'src/main/agent/adapters/codex/command-builder.ts'
      - 'src/main/agent/adapters/codex/hook-manager.ts'
      - 'src/main/pty/spawn/typed-launch.ts'
      - 'tests/unit/typed-launch-round-trip.test.ts'
      - 'tests/unit/helpers/shell-argv-probe.ts'
      - 'tests/unit/command-builder.test.ts'
      - 'tests/unit/shell-quote.test.ts'
      - 'tests/unit/codex-hook-overrides.test.ts'
      - 'vitest.config.mts'
      - '.github/workflows/shell-quoting-posix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-quoting-posix-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, and checked against the digest GitHub publishes for the asset.
  NUSHELL_VERSION: '0.116.0'
  NUSHELL_SHA256: '9f73a6913f9515a621bd916dc91d7f3e0494e488161c2d686f6b98ffa0555945'
  # No CUDA download from nuget.org in npm ci. The note at the top of ci.yml has the details.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Skips the run below on a push whose tree its PR already tested. See the note at the top of ci.yml.
  tested-tree:
    name: Tree already tested
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check the pushed tree against its PR
        id: tree
        uses: ./.github/actions/tested-tree

  posix-shells:
    name: shell quoting against real nushell and fish
    needs: [tested-tree]
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh
      - name: Install nushell
        run: |
          archive="nu-${NUSHELL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/nushell/nushell/releases/download/${NUSHELL_VERSION}/$archive"
          echo "${NUSHELL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nushell"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nushell" --strip-components=1
          echo "$RUNNER_TEMP/nushell" >> "$GITHUB_PATH"
      # Says which shell builds this run measured.
      - name: Report the shells under test
        run: |
          fish --version
          nu --version
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Round-trip the escapes through real shells
        # A shell missing from the runner fails the run instead of skipping it.
        env:
          KANGENTIC_SHELL_PROBE_REQUIRE_POSIX_SHELLS: '1'
        run: npx vitest run tests/unit/command-builder.test.ts tests/unit/shell-quote.test.ts tests/unit/codex-hook-overrides.test.ts
      # Each shell's launcher form, typed while the shell is in its startup files.
      - name: Run a typed launch through each real shell
        env:
          KANGENTIC_TYPED_LAUNCH_REQUIRE_SHELLS: 'bash,zsh,fish,nu'
        run: npx vitest run tests/unit/typed-launch-round-trip.test.ts
