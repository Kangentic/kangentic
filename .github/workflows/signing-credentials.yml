name: Signing credentials

# Proves, every night, that the credentials a release signs with still work.
#
# What it catches that nothing else can: a credential that died with no commit.
# The Azure federated credential is deleted or the app loses its signing role,
# an Apple agreement goes unaccepted, an app-specific password is revoked, the
# Developer ID certificate runs out, the Sentry token is deleted. release.yml's
# two preflight jobs only check that each secret is non-empty, so before this
# workflow a dead credential was first found inside the release matrix, after
# the tag and the draft release existed.
#
# Each job uses a credential the way the release does:
#
#   - Windows signs in to Azure as the release's Windows leg does (azure/login,
#     GitHub's OIDC token, the release-windows environment, no client secret),
#     signs a throwaway file through build/windowsSign.js, the hook
#     electron-builder calls, then requires a valid, timestamped signature. That
#     also covers the TrustedSigning PowerShell module, which the hook installs
#     from the PowerShell Gallery with no pinned version.
#   - macOS asks Apple for the notarization history with the same three values
#     build/afterSign.js hands to notarytool. It runs on macOS because only
#     notarytool takes an Apple ID with an app-specific password.
#   - Linux reads the Developer ID certificate's end date out of the .p12 secret
#     and goes red inside CERTIFICATE_WARN_DAYS, and asks Sentry whether the
#     symbol-upload token still authenticates.
#
# What it costs: three short jobs a night, one of them on macOS for under a
# minute, at an hour when no pull request is likely to want the slot. It signs one
# file a night with the Trusted Signing account.
#
# Schedule and dispatch only, and never a required check. A pull request has no
# way to change a credential, and a fork's pull request cannot read the secrets.
# What reads it is /release: the release skill requires the newest scheduled run
# to be green before it creates a tag (.claude/skills/release/SKILL.md, step 8),
# so a red run here stops a release before anything is tagged.
# tests/unit/scheduled-workflows.test.ts pins that this file reads every secret
# release.yml reads, and that its Azure literals match release.yml's.
#
# Nothing here is uploaded or cached, and no job prints a certificate's subject,
# which can be a legal name.

on:
  schedule:
    # 05:43 UTC. Off the hour, and clear of package-smoke's macOS legs at 03:17.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signing-credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job runs in the release's own Windows environment on purpose. Azure
  # accepts GitHub's OIDC token through a federated credential whose subject
  # names that environment, so only a job in it signs in the way the release's
  # Windows leg does. A job outside it would need a credential of its own and
  # would prove nothing about the release's. The environment has no approval
  # rule. If one is ever added, this job waits for it and times out red.
  windows-signing:
    name: Azure Trusted Signing
    if: github.repository == 'Kangentic/kangentic'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release-windows
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require the Azure signing secrets
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Azure secret(s):$missing. Add them as repository secrets. A release would stop at its preflight-signing job."
            exit 1
          fi
          echo "Azure signing secrets are present."
      # The same two steps the release's Windows leg runs before it builds. No
      # client secret: GitHub's OIDC token is traded for an Azure sign-in.
      - name: Sign in to Azure for code signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Get the code signing token while the sign-in is fresh
        shell: pwsh
        run: |
          $expires = az account get-access-token --resource https://codesigning.azure.net --query expiresOn --output tsv
          if ($LASTEXITCODE -ne 0 -or -not $expires) {
            Write-Output "::error::Azure gave no code signing token. A release's Windows leg would fail here. Check the federated credential and the signing role on the app registration."
            exit 1
          }
          Write-Output "The code signing token is good until $expires."
      # A small library built on the runner: a PE file like the installer, with no
      # entry point. It must start unsigned, so a valid signature below can only
      # have come from this run.
      - name: Build a throwaway file to sign
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'signing-probe'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $file = Join-Path $folder 'kangentic-signing-probe.dll'
          Add-Type -TypeDefinition 'public static class KangenticSigningProbe { }' -OutputAssembly $file -OutputType Library
          $status = (Get-AuthenticodeSignature -LiteralPath $file).Status
          if ($status -ne 'NotSigned') {
            Write-Output "::error::The probe file should start unsigned, and reads $status."
            exit 1
          }
          "PROBE_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Built an unsigned probe file."
      # The endpoint, account and profile are the literals release.yml's build step
      # sets. tests/unit/scheduled-workflows.test.ts fails when they differ.
      - name: Sign it through the release's own hook
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
          AZURE_SIGNING_ACCOUNT: sign-kangentic
          AZURE_CERT_PROFILE: kangentic-signing
        run: |
          node -e "require('./build/windowsSign.js').default({ path: process.env.PROBE_FILE }).catch((error) => { console.error(error); process.exit(1); })"
      - name: Require a valid, timestamped signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:PROBE_FILE
          Write-Output "Status: $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Output "Signing certificate ends: $($signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('u'))"
          }
          Write-Output "Timestamped: $($null -ne $signature.TimeStamperCertificate)"
          if ($signature.Status -ne 'Valid') {
            Write-Output "::error::Azure Trusted Signing did not produce a valid signature (status $($signature.Status)). A release's Windows leg would fail here, or ship an installer Windows does not trust."
            exit 1
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            Write-Output "::error::The signature carries no timestamp. A Trusted Signing certificate lasts days, so a shipped installer would stop verifying when its certificate ends. build/windowsSign.js must name a timestamp server."
            exit 1
          }
          Write-Output "Azure Trusted Signing signed and timestamped the probe file."
      - name: Delete the probe file
        if: always()
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'signing-probe'
          if (Test-Path -LiteralPath $folder) {
            Remove-Item -LiteralPath $folder -Recurse -Force
          }

  apple-notarization:
    name: Apple notarization sign-in
    if: github.repository == 'Kangentic/kangentic'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Require the Apple notarization secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Apple secret(s):$missing. Add them as repository secrets. A release would stop at its preflight-signing job."
            exit 1
          fi
          echo "Apple notarization secrets are present."
      # A read. It submits nothing, and its listing goes nowhere: the names of
      # past submissions do not belong in a public log. notarytool writes its own
      # reason to stderr when Apple refuses, which stays visible.
      - name: Ask Apple for the notarization history
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if ! xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --output-format json > /dev/null; then
            echo "::error::Apple refused the notarization sign-in. A release's macOS legs would fail to notarize. Common causes: a revoked app-specific password, an agreement waiting to be accepted at developer.apple.com, or a lapsed membership."
            exit 1
          fi
          echo "Apple accepted the notarization sign-in."

  certificate-and-symbols:
    name: Developer ID certificate and Sentry token
    if: github.repository == 'Kangentic/kangentic'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Red this many days before the Developer ID certificate ends. /release
      # reads this workflow, so that is also how long before the end a release
      # stops until the certificate is renewed.
      CERTIFICATE_WARN_DAYS: 30
    steps:
      - name: Require the certificate and Sentry secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KANGENTIC_SENTRY_TOKEN: ${{ secrets.KANGENTIC_SENTRY_TOKEN }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD KANGENTIC_SENTRY_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. Add them as repository secrets. A release would stop at a preflight job."
            exit 1
          fi
          echo "The certificate and Sentry secrets are present."
      # The .p12 is decoded in a pipe and never written to disk, its key is never
      # emitted (-nokeys), and its password is read from the environment, not
      # from the command line. -legacy loads the ciphers a Keychain export uses,
      # which OpenSSL 3 no longer reads by default. Only the end date is printed.
      - name: Read the Developer ID certificate's end date
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate=$(printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode | openssl pkcs12 -legacy -nokeys -clcerts -passin env:APPLE_CERTIFICATE_PASSWORD)
          end_date=$(printf '%s\n' "$certificate" | openssl x509 -noout -enddate)
          echo "Developer ID certificate: $end_date"
          if ! printf '%s\n' "$certificate" | openssl x509 -noout -checkend "$((CERTIFICATE_WARN_DAYS * 86400))" > /dev/null; then
            echo "::error::The Developer ID certificate ends within $CERTIFICATE_WARN_DAYS days ($end_date). Create a new Developer ID Application certificate, export it as a .p12, and replace APPLE_CERTIFICATE_BASE64 and APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi
          echo "The Developer ID certificate is good for more than $CERTIFICATE_WARN_DAYS days."
      # The first request a symbol upload makes. 200 means Sentry took the token
      # for the kangentic organization; 401 or 403 means it did not.
      - name: Ask Sentry whether the symbol-upload token still authenticates
        env:
          KANGENTIC_SENTRY_TOKEN: ${{ secrets.KANGENTIC_SENTRY_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $KANGENTIC_SENTRY_TOKEN" https://sentry.io/api/0/organizations/kangentic/chunk-upload/)
          if [ "$status" != "200" ]; then
            echo "::error::Sentry answered $status to the symbol-upload token. A release would fail its sourcemap and debug-file upload. Create a new token and replace KANGENTIC_SENTRY_TOKEN."
            exit 1
          fi
          echo "Sentry accepted the symbol-upload token."
