<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kangentic demo</title>
    <!--
      The web build of the desktop renderer. demo/vite.config.mts injects five classic
      scripts here, in this order, ahead of the module bundle below (each name carries a
      content hash, as Vite's own chunks do, so a cached copy can never be a stale one):
        demo-scenes-<hash>.js       the scene registry, the app version, the recordings index, and the guest pages (generated at build time)
        demo-boot-<hash>.js         demo/boot.js: the URL contract, config overrides, still/embed CSS
        demo-webview-<hash>.js      demo/webview-shim.js: an iframe standing in for Electron's <webview> tag
        mock-electron-api-<hash>.js tests/ui/mock-electron-api.js, verbatim
        demo-seed-<hash>.js         the sample install and the scene applier (generated at build time)
      A classic script runs while the parser reaches it; the module script is deferred, so the
      bridge is always in place before the first renderer module evaluates. The first module
      only defines the loader the seed fetches its replay emulator with (demo/replay-emulator.ts).
    -->
  </head>
  <body class="bg-surface text-fg overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/demo/replay-emulator-entry.ts"></script>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
