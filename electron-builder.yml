appId: com.kangentic.app
electronLanguages:
  - en-US
removePackageScripts: true
productName: Kangentic
extraMetadata:
  description: Kangentic

directories:
  output: out

# Only include build output + native modules (matches old forge.config.ts ignore function)
files:
  - ".vite/build/**"
  - "package.json"
  # better-sqlite3 13 ships its native addon as Node-API prebuilds under
  # prebuilds/<platform>-<arch>.node and loads them itself (lib/binding.js);
  # build/afterPack.js strips every prebuild but the target's.
  - "node_modules/better-sqlite3/**"
  - "node_modules/node-pty/**"
  - "node_modules/sherpa-onnx-node/**"
  - "node_modules/sherpa-onnx-*/**"
  # Terminal Font Family picker: font-list shells out to fc-list (Linux) / a
  # PowerShell script (Windows) and ships a bundled native binary for macOS.
  - "node_modules/font-list/**"
  # The pty host reads a process's environment through koffi on Windows and macOS to find
  # what a task left running (src/main/pty/process-tag/). koffi loads its
  # prebuilt binary from the per-platform @koromix/koffi-* package.
  - "node_modules/koffi/**"
  - "node_modules/@koromix/koffi-*/**"
  # Conversation-memory retrieval: sqlite-vec loadable extension (per-platform
  # binary packages) + transformers.js. The embed worker runs on the NATIVE
  # onnxruntime-node execution providers (DirectML / WebGPU / CPU) because
  # transformers.js v4 dropped the browser 'wasm' backend in Node, so
  # onnxruntime-node and its native binaries (onnxruntime_binding.node +
  # onnxruntime.dll + DirectML.dll) must ship and be unpacked. onnxruntime-web is
  # retained only as transformers' optional peer; its wasm path is now unused
  # (follow-up: drop it once the packaged smoke test confirms onnxruntime-node is
  # the sole backend).
  - "node_modules/sqlite-vec/**"
  - "node_modules/sqlite-vec-*/**"
  - "node_modules/@huggingface/transformers/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/onnxruntime-web/**"
  # The embed worker is forked from the UNPACKED tree (see asarUnpack), where
  # Node resolves modules from real directories and never looks inside the
  # asar. So every package transformers.node.cjs requires at module scope has
  # to be listed here AND unpacked below: onnxruntime-common (also required by
  # onnxruntime-node), sharp, and sharp's own runtime deps (@img/*, detect-libc,
  # semver). With any of them missing the packaged worker exits 1 on every fork
  # (DESKTOP-H). build/afterPack.js loads the worker's externals from the
  # unpacked tree after packing and fails the build when this closure drifts.
  - "node_modules/onnxruntime-common/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  - "!node_modules/better-sqlite3/{src,deps}/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/node-pty/{src,scripts,deps,third_party}/**"
  - "!**/*.map"

asar: true
asarUnpack:
  # The pty host is forked from the unpacked tree on Windows and Linux, where
  # Node resolves modules from real directories and never looks inside the
  # asar, so all of node-pty unpacks, not only its prebuilt binaries. That also
  # lets its ConPTY conout worker thread load from a real directory. macOS
  # forks the host from inside the asar instead (node-pty's spawn-helper
  # lookup rewrites app.asar to app.asar.unpacked), and reads the same
  # unpacked files through it.
  - "node_modules/node-pty/**"
  # The pty host loads koffi from the same unpacked tree, and a native addon
  # cannot be dlopen'd from inside an asar.
  - "node_modules/koffi/**"
  - "node_modules/@koromix/koffi-*/**"
  - "node_modules/sherpa-onnx-*/**"
  # font-list's macOS binary is spawned via child_process, which cannot exec a
  # path inside an asar archive.
  - "node_modules/font-list/**"
  # SQLite dlopen cannot read a loadable extension inside an asar archive, and a
  # native .node addon (plus its sibling onnxruntime.dll / DirectML.dll on
  # Windows) cannot be dlopen'd from inside asar either; the embed worker runs
  # from the unpacked tree so it resolves sqlite-vec, transformers, and
  # onnxruntime-node via plain node_modules resolution. Plain resolution cuts
  # both ways: a module the worker reaches transitively that stays inside the
  # asar is invisible to it, so the whole runtime closure of transformers.js
  # (onnxruntime-common, sharp, @img/*, detect-libc, semver) is unpacked too.
  # The afterPack gate proves the closure loads before the build is accepted.
  - "node_modules/sqlite-vec-*/**"
  - "node_modules/@huggingface/transformers/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/onnxruntime-web/**"
  - "node_modules/onnxruntime-common/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  # The retrieval worker opens the project databases itself, so better-sqlite3
  # and its prebuilt addon must resolve from the unpacked tree it runs in. It
  # takes the sqlite-vec binary's path from main, so the sqlite-vec root
  # package can stay inside the asar.
  - "node_modules/better-sqlite3/**"
  - ".vite/build/embed-worker.js"
  - ".vite/build/line-count-worker.js"
  - ".vite/build/dictation-worker.js"
  - ".vite/build/retrieval-worker.js"
  - ".vite/build/pty-host.js"
  - ".vite/build/event-bridge.js"
  - ".vite/build/status-bridge.js"
  - ".vite/build/plugins/**"

extraResources:
  - from: node_modules/@kangentic/branding/resources/desktop/icon.png
    to: icon.png
  - from: node_modules/@kangentic/branding/resources/desktop/icon.ico
    to: icon.ico

# Every native module ships Node-API prebuilds (better-sqlite3, node-pty, koffi,
# sherpa-onnx-node, onnxruntime-node, sharp), so nothing is compiled at pack time.
npmRebuild: false
afterPack: build/afterPack.js
afterSign: build/afterSign.js

win:
  target: nsis
  icon: node_modules/@kangentic/branding/resources/desktop/icon.ico
  signtoolOptions:
    sign: build/windowsSign.js

nsis:
  oneClick: true
  perMachine: false
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Grants ALL APPLICATION PACKAGES read access to the per-user install folder on
  # every install and update; Electron 44.5+ aborts startup without it on machines
  # whose folder ACL carries an AppContainer entry. See the file for why.
  include: build/installer.nsh


mac:
  target:
    - dmg
    - zip
  # Pin filenames to match what the launcher (packages/launcher/bin/kangentic.js)
  # and scripts/release-assets.js expect. These were previously electron-builder
  # defaults, which only carry the "-arm64" infix because the default arch is x64
  # and the default templates omit ${arch} when it matches: adding mac.defaultArch,
  # or an upstream change to that comparison, would silently rename both assets and
  # 404 every `npx kangentic` on macOS. Any user-set pattern flips isUserForced
  # (platformPackager.js:551, verified against electron-builder 26.8.1; it is a
  # caret range, so re-check that line number after a bump), so ${arch} then
  # always expands.
  #
  # This one is the ZIP pattern, not a shared one. Resolution order is
  # target options -> mac.artifactName -> config.artifactName, and only dmg has a
  # target-options section, so the zip lands here while dmg.artifactName below
  # overrides for the dmg. The ${os} macro expands to "mac".
  artifactName: "${productName}-${version}-${arch}-${os}.${ext}"
  icon: node_modules/@kangentic/branding/resources/desktop/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  strictVerify: false
  # Electron 44 dropped macOS 12, so 13.0 is the oldest system it starts on.
  minimumSystemVersion: "13.0"
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements.plist
  extendInfo:
    # Shown in the macOS microphone-permission prompt for voice dictation.
    NSMicrophoneUsageDescription: "Kangentic uses your microphone for voice-to-text dictation into terminals. Audio is transcribed locally and never leaves your machine unless you configure a remote backend."

dmg:
  # Overrides mac.artifactName for the dmg only: the dmg carries no "-mac" infix.
  # Without this the dmg would inherit the zip pattern above and be renamed.
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  target:
    - deb
    - rpm
  icon: node_modules/@kangentic/branding/resources/desktop/icon.png
  category: Development

deb:
  # Pin filename to match the launcher and scripts/release-assets.js. Same reason
  # as mac.artifactName above: this was an inherited electron-builder default.
  artifactName: "${name}_${version}_${arch}.${ext}"
  depends:
    - libnss3
    - libatk-bridge2.0-0
    - libgtk-3-0
    - libgbm1
    - libasound2t64 | libasound2
    - libdrm2
    - libxshmfence1

rpm:
  # Pin filename to match what the launcher (packages/launcher/bin/kangentic.js) expects.
  # electron-builder's default may or may not include the -1 release number.
  artifactName: "${name}-${version}-1.${arch}.rpm"
  # Soname capabilities, not package names: RPM package names for these libraries
  # differ per distro (Fedora "libxshmfence" / openSUSE "libxshmfence1"; Fedora "nss" /
  # openSUSE "mozilla-nss"), but every distro's rpm auto-generates a Provides: for the
  # soname itself, so it resolves everywhere. Each string below was confirmed against
  # a real Fedora 44 package's `rpm -q --provides` output and confirmed to survive the
  # electron-builder -> fpm -> rpmbuild pipeline unmodified via `rpm -qpR`.
  # See .claude/rules/linux-package-dependencies.md
  depends:
    - libnss3.so()(64bit)
    - libatk-1.0.so.0()(64bit)
    - libgtk-3.so.0()(64bit)
    - libgbm.so.1()(64bit)
    - libasound.so.2()(64bit)
    - libdrm.so.2()(64bit)
    - libxshmfence.so.1()(64bit)

publish:
  provider: github
  owner: Kangentic
  repo: kangentic
  releaseType: draft

# Bakes RELEASE_NOTES.md into every generated latest*.yml at build time, so
# electron-updater's GitHubProvider finds releaseNotes already populated and
# never falls back to the (HTML, unsanitized) Atom feed content.
releaseInfo:
  releaseNotesFile: RELEASE_NOTES.md
